<text x="40" y="43" font-size="11" letter-spacing="3.5" font-weight="600">THE JOURNEY / LEVELING UP</text>
<text x="40" y="78" font-size="29" font-weight="500" letter-spacing="-0.8">Different infrastructure. Same curiosity.</text>
<text x="40" y="104" font-size="14" fill="#85445f">From bridges to pipelines to agents — one plot twist at a time.</text>
