<rect x="1" y="1" width="958" height="398" rx="26" fill="url(#bg)" stroke="#e4c7e0"/>
<g font-family="DejaVu Sans,Arial,sans-serif" fill="#643b63">
<text x="40" y="43" font-size="13" letter-spacing="3" font-weight="bold">THE JOURNEY / LEVELING UP</text>
<text x="40" y="78" font-size="25" font-weight="bold">Different infrastructure. Same curiosity.</text>
<text x="40" y="104" font-size="14" fill="#876a89">From bridges to pipelines to agents — one plot twist at a time.</text>
<path d="M 85 220 C 180 220 180 170 290 170 S 430 240 510 240 S 650 170 730 170 L 880 170" fill="none" stroke="#e5d3e7" stroke-width="15" stroke-linecap="round"/>
