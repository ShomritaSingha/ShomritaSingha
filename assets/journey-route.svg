<g fill="#fff" stroke="#bc83b0" stroke-width="3"><circle cx="85" cy="220" r="13"/><circle cx="290" cy="170" r="13"/><circle cx="510" cy="240" r="13"/><circle cx="790" cy="170" r="13"/></g>
<g text-anchor="middle" font-size="12" font-weight="bold"><text x="85" y="224">01</text><text x="290" y="174">02</text><text x="510" y="244">03</text><text x="790" y="174">04</text></g>
<circle r="7" fill="#b34c8d" stroke="#fff" stroke-width="3"><animateMotion dur="10s" repeatCount="indefinite" path="M 85 220 C 180 220 180 170 290 170 S 430 240 510 240 S 650 170 730 170 L 880 170"/></circle>
<g text-anchor="middle">
<text x="115" y="272" font-size="17" font-weight="bold">Civil Engineering</text><text x="115" y="295" font-size="13" fill="#876a89">Bridges looked cool.</text><text x="115" y="315" font-size="13" fill="#876a89">Building them? Not my thing.</text>
<text x="305" y="350" font-size="16" font-weight="bold">Traffic data project</text><text x="305" y="373" font-size="13" fill="#876a89">The data obsession begins.</text><path d="M290 188 L290 326" stroke="#d7b7d2" stroke-dasharray="3 5"/>
<text x="530" y="290" font-size="17" font-weight="bold">Data Engineering</text><text x="530" y="313" font-size="13" fill="#876a89">Python / SQL / GCP</text><text x="530" y="334" font-size="13" fill="#876a89">Pipelines, orchestration, dbt</text>
<rect x="693" y="202" width="194" height="27" rx="13" fill="#e8d9f5"/><text x="790" y="220" font-size="11" letter-spacing="1" font-weight="bold">NEXT LEVEL / IN PROGRESS</text>
<text x="790" y="257" font-size="19" font-weight="bold">AI Engineering</text><text x="790" y="282" font-size="13" fill="#876a89">MSIS @ UMD</text><text x="790" y="304" font-size="13" fill="#876a89">LLMs / RAG / MCP / Agents</text>
