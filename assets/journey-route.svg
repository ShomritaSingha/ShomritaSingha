<text x="115" y="272" font-size="17" font-weight="600">Civil Engineering</text><text x="115" y="295" font-size="13" fill="#85445f">Bridges looked cool.</text><text x="115" y="315" font-size="13" fill="#85445f">Building them? Not my thing.</text>
<text x="305" y="350" font-size="16" font-weight="600">Traffic data project</text><text x="305" y="373" font-size="13" fill="#85445f">The data obsession begins.</text><path d="M290 188 L290 326" stroke="#d78aa9" stroke-dasharray="3 5"/>
<text x="530" y="290" font-size="17" font-weight="600">Data Engineering</text><text x="530" y="313" font-size="13" fill="#85445f">Python / SQL / GCP</text><text x="530" y="334" font-size="13" fill="#85445f">Pipelines, orchestration, dbt</text>
<rect x="693" y="202" width="194" height="27" rx="13" fill="#f19cbe"/><text x="790" y="220" font-size="11" letter-spacing="1" font-weight="600">NEXT LEVEL / IN PROGRESS</text>
<text x="790" y="257" font-size="19" font-weight="600">AI Engineering</text><text x="790" y="282" font-size="13" fill="#85445f">MSIS @ UMD</text><text x="790" y="304" font-size="13" fill="#85445f">LLMs / RAG / MCP / Agents</text>
