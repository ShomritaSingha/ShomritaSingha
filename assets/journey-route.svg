<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Sammy's engineering journey</title><desc id="desc">Civil Engineering, a traffic data project, Data Engineering, and the next level: AI Engineering.</desc>
